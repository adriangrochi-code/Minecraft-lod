// ============================================================================
// build.gradle — Minecraft LOD Mod
//
// Basado en el MDK oficial de NeoForge 1.21.1 con ModDevGradle (el plugin
// recomendado hoy por NeoForge, reemplaza a NeoGradle userdev).
// La versión exacta de NeoForge está en gradle.properties (neo_version).
// ============================================================================

plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.su5ed.dev/releases' } // Forgified Fabric API (VulkanMod integrado)
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ./gradlew runClient -Pperfil=archivo.jfr: perfil de CPU/memoria con Java Flight Recorder.
            if (project.hasProperty('perfil')) {
                jvmArgument "-XX:StartFlightRecording=filename=${project.property('perfil')},settings=profile,delay=45s,duration=150s"
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Minecraft/NeoForge en el classpath de test: permite testear código
    // que usa tipos del juego (payloads de network/, FriendlyByteBuf).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Vulkan para XeSS/DLSS (render/InteropVulkan): los bindings de LWJGL van
// REUBICADOS dentro del mod. VulkanMod carga su propio lwjgl-vulkan como módulo
// org.lwjgl.vulkan; con el paquete original, los dos mods juntos no arrancan.
configurations {
    vulkanReubicado { transitive = false }
}

dependencies {
    vulkanReubicado "org.lwjgl:lwjgl-vulkan:3.3.3"
}

var reubicarVulkan = tasks.register('reubicarVulkan', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    configurations = [project.configurations.vulkanReubicado]
    archiveBaseName = 'lwjgl-vulkan-reubicado'
    destinationDirectory = layout.buildDirectory.dir('reubicado')
    relocate 'org.lwjgl.vulkan', 'com.example.minecraftlodmod.lwjglvk'
    exclude 'module-info.class', 'META-INF/**'
}

dependencies {
    compileOnly files(reubicarVulkan)
    testImplementation files(reubicarVulkan)
}

// Las clases reubicadas viajan como recursos del mod: así también las ve runClient.
processResources {
    dependsOn reubicarVulkan
    from(zipTree(reubicarVulkan.flatMap { it.archiveFile }))
}

// ---------------------------------------------------------------------------
// VulkanMod integrado (paquete vulkanmod/, LGPL-3.0; fork NeoForge de yiyuyan,
// 0.5.5-dev+3.1). Lo que necesita en tiempo de ejecución viaja dentro del mod:
//  - lwjgl-vulkan/vma/shaderc (clases + nativos de Windows y Linux) como recursos,
//    igual que el lwjgl-vulkan reubicado de arriba (varios jars con el mismo
//    nombre y distinto clasificador no se pueden meter con jarJar). Con esto, el
//    VulkanMod suelto no puede estar instalado a la vez (paquete org.lwjgl.vulkan
//    repetido): el integrado lo reemplaza.
//  - los módulos de Forgified Fabric API que usa su armado de bloques (FRAPI),
//    como jar-in-jar (Apache-2.0).
// ---------------------------------------------------------------------------
configurations {
    librasVulkan { transitive = false }
}

dependencies {
    librasVulkan "org.lwjgl:lwjgl-vulkan:3.3.3"
    librasVulkan "org.lwjgl:lwjgl-vma:3.3.3"
    librasVulkan "org.lwjgl:lwjgl-vma:3.3.3:natives-windows"
    librasVulkan "org.lwjgl:lwjgl-vma:3.3.3:natives-linux"
    librasVulkan "org.lwjgl:lwjgl-shaderc:3.3.3"
    librasVulkan "org.lwjgl:lwjgl-shaderc:3.3.3:natives-windows"
    librasVulkan "org.lwjgl:lwjgl-shaderc:3.3.3:natives-linux"
    compileOnly "org.lwjgl:lwjgl-vulkan:3.3.3"
    compileOnly "org.lwjgl:lwjgl-vma:3.3.3"
    compileOnly "org.lwjgl:lwjgl-shaderc:3.3.3"

    for (String modulo : ['fabric-api-base:0.4.42+d1308ded19',
                          'fabric-renderer-api-v1:3.4.1+9125b6dc19',
                          'fabric-rendering-fluids-v1:3.1.6+ddc51b4719',
                          'fabric-rendering-data-attachment-v1:0.3.49+73761d2e19',
                          'fabric-block-view-api-v2:1.0.11+e9036fd419']) {
        String coordenada = "org.sinytra.forgified-fabric-api:${modulo}"
        String versionModulo = modulo.split(':')[1]
        implementation coordenada
        jarJar(coordenada) {
            version {
                strictly "[${versionModulo},)"
                prefer versionModulo
            }
        }
    }
}

// Loader de Fabric forjado: lo piden los puntos de entrada de esos módulos (ClientModInitializer).
dependencies {
    String ffl = 'org.sinytra:forgified-fabric-loader:2.5.68+0.18.4+1.21.1'
    compileOnly ffl
    runtimeOnly "${ffl}:full"
    jarJar("${ffl}:full") {
        version {
            strictly '[2.5.68+0.18.4+1.21.1,)'
            prefer '2.5.68+0.18.4+1.21.1'
        }
    }
}

processResources {
    from(configurations.librasVulkan.collect { zipTree(it) }) {
        exclude 'module-info.class', 'META-INF/**'
    }
}

dependencies {

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Expande los ${...} de src/main/templates (neoforge.mods.toml) con los
// valores de gradle.properties. Sin esto el mods.toml se empaqueta con los
// placeholders literales y el mod no carga.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
