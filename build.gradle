// ============================================================================
// build.gradle — Minecraft LOD Mod
//
// Basado en el MDK oficial de NeoForge 1.21.1 con ModDevGradle (el plugin
// recomendado hoy por NeoForge, reemplaza a NeoGradle userdev).
// La versión exacta de NeoForge está en gradle.properties (neo_version).
// ============================================================================

plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' } // Cloth Config
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Minecraft/NeoForge en el classpath de test: permite testear código
    // que usa tipos del juego (payloads de network/, FriendlyByteBuf).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Vulkan para XeSS/DLSS (render/InteropVulkan): los bindings de LWJGL van
// REUBICADOS dentro del mod. VulkanMod carga su propio lwjgl-vulkan como módulo
// org.lwjgl.vulkan; con el paquete original, los dos mods juntos no arrancan.
configurations {
    vulkanReubicado { transitive = false }
}

dependencies {
    vulkanReubicado "org.lwjgl:lwjgl-vulkan:3.3.3"
}

var reubicarVulkan = tasks.register('reubicarVulkan', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    configurations = [project.configurations.vulkanReubicado]
    archiveBaseName = 'lwjgl-vulkan-reubicado'
    destinationDirectory = layout.buildDirectory.dir('reubicado')
    relocate 'org.lwjgl.vulkan', 'com.example.minecraftlodmod.lwjglvk'
    exclude 'module-info.class', 'META-INF/**'
}

dependencies {
    compileOnly files(reubicarVulkan)
    testImplementation files(reubicarVulkan)
}

// Las clases reubicadas viajan como recursos del mod: así también las ve runClient.
processResources {
    dependsOn reubicarVulkan
    from(zipTree(reubicarVulkan.flatMap { it.archiveFile }))
}

dependencies {
    // Cloth Config — pantalla in-game de config/, dependencia OPCIONAL:
    // solo se compila contra ella; sin Cloth instalado se usa la pantalla
    // automática de NeoForge. runtimeOnly la suma a runClient para verla.
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Expande los ${...} de src/main/templates (neoforge.mods.toml) con los
// valores de gradle.properties. Sin esto el mods.toml se empaqueta con los
// placeholders literales y el mod no carga.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
