modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Solo para el escalado FSR experimental (render/EscaladoFsr).
[[mixins]]
config = "minecraftlodmod.mixins.json"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Cloth Config: pantalla de config más completa si está instalado; sin él
# se usa la pantalla automática de NeoForge (ver config/PantallaConfig).
[[dependencies.${mod_id}]]
    modId = "cloth_config"
    type = "optional"
    versionRange = "[15,)"
    ordering = "NONE"
    side = "CLIENT"
